workflows:
  react-app:
    name: PS VPN Web Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    environment:
      node: v18.16.0
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build React App
        script: npm run build
    artifacts:
      - dist/**/*

  android-app:
    name: PS VPN Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: v18.16.0
      groups:
        - android-signing
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Mobile Setup (Capacitor)
        script: |
          npx cap add android
          npx cap copy
          npx cap sync
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
