workflows:
  android-app:
    name: PS VPN Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    environment:
      node: 22.14.0
      java: 21
      groups:
        - android-signing
    scripts:
      - name: Install dependencies
        script: |
          # Fix for potential native binding issues
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
      - name: Build Web App
        script: |
          npm run build
      - name: Mobile Setup (Capacitor)
        script: |
          # Initialize Android if not present
          if [ ! -d "android" ]; then
            npx cap add android --package-id com.psvpn.app --app-name "PS VPN"
          fi
          npx cap sync
          npx cap copy
      - name: Build Android APK
        script: |
          cd android
          # Ensure gradlew is executable
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  react-app:
    name: PS VPN Web Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    environment:
      node: 22.14.0
    scripts:
      - name: Install dependencies
        script: |
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
      - name: Build React App
        script: |
          npm run build
    artifacts:
      - dist/**/*
