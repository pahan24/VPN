workflows:
  android-app:
    name: PS VPN Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    environment:
      node: 22.14.0
      java: 21
      groups:
        - android-signing
    scripts:
      - name: Install dependencies
        script: |
          # Fresh install to avoid Tailwind native binding issues
          rm -rf node_modules package-lock.json
          npm install --include=optional --legacy-peer-deps
      - name: Build and Setup Mobile
        script: |
          # Build the web app first
          npm run build
          
          # Initialize Capacitor Android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sync and Copy
          npx cap sync android
          npx cap copy android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  react-app:
    name: PS VPN Web Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    environment:
      node: 22.14.0
    scripts:
      - name: Install dependencies
        script: |
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
      - name: Build React App
        script: |
          npm run build
    artifacts:
      - dist/**/*
