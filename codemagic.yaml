workflows:
  android-app:
    name: PS VPN Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    environment:
      node: 20.11.0
      groups:
        - android-signing
    scripts:
      - name: Install dependencies
        script: |
          # Fix for Tailwind 4 native binding issues
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
      - name: Build Web App
        script: |
          npm run build
      - name: Mobile Setup (Capacitor)
        script: |
          # Initialize Android if not present
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy
          npx cap sync
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  react-app:
    name: PS VPN Web Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    environment:
      node: 20.11.0
    scripts:
      - name: Install dependencies
        script: |
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
      - name: Build React App
        script: |
          npm run build
    artifacts:
      - dist/**/*
